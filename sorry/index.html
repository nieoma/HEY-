<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ffbad8;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

.container {
    text-align: center;
    position: relative;
    z-index: 2;
}

.photo {
    width: 250px;
    max-width: 80%;
    border-radius: 20px;
    box-shadow: 0 0 0 rgba(0,0,0,0.15);
    margin-bottom: 25px;
}

.start-btn {
    background-color: #ff8fb1;
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 20px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    background-color: #ff6f9a;
    transform: scale(1.05);
}

/* Sparkles */
.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: floatSparkle linear infinite;
    opacity: 0;
}

@keyframes floatSparkle {
    0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    80% {
        opacity: 1;
    }
    100% {
        transform: translateY(-120px) scale(1);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <!-- Replace image.png with your image name -->
    <img src="image1.png" alt="Photo" class="photo">

    <br>

    <button class="start-btn" onclick="window.location.href='page2.html'">
        START
    </button>
</div>

<script>
const sparkleCount = 60;

for (let i = 0; i < sparkleCount; i++) {
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.animationDuration = (4 + Math.random() * 6) + "s";
    sparkle.style.animationDelay = Math.random() * 6 + "s";
    sparkle.style.width = sparkle.style.height =
        (2 + Math.random() * 4) + "px";

    document.body.appendChild(sparkle);
}
</script>

</body>
</html>
